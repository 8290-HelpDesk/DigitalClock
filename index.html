<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<style>
  :root {
    --scale: 1;
    --ink: #16181c;
    --dim: #a8aeb6;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    cursor: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #shift {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate3d(0, 0, 0);
  }

  #clock {
    /* min() stops very wide screens from overflowing vertically */
    font-size: calc(var(--scale) * min(20vw, 44vh));
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    line-height: 0.85;
    white-space: nowrap;
    color: var(--ink);
  }

  #sec { color: var(--dim); }

  /* ---- type presets -------------------------------------------------- */

  /* 1. Grotesque - airy and light, seconds as a quiet trailing note */
  .f-grotesque #clock {
    font-family: "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif;
    font-weight: 200;
    letter-spacing: -0.03em;
  }
  .f-grotesque #sec {
    font-size: 0.34em;
    font-weight: 400;
    letter-spacing: 0;
    margin-left: 0.18em;
    vertical-align: 0.9em;
  }

  /* 2. Heavy - blunt and dense, reads from the far end of a corridor */
  .f-heavy #clock {
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    font-weight: 900;
    letter-spacing: -0.055em;
  }
  .f-heavy #sec {
    font-size: 0.30em;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-left: 0.16em;
    vertical-align: 1.05em;
  }

  /* 3. Mono - technical and evenly spaced, seconds carry equal weight */
  .f-mono #clock {
    font-family: Cousine, "Roboto Mono", "DejaVu Sans Mono", Consolas, monospace;
    font-weight: 400;
    letter-spacing: -0.02em;
    font-size: calc(var(--scale) * min(15vw, 34vh));
  }
  .f-mono #sec {
    font-size: 0.55em;
    margin-left: 0.12em;
    vertical-align: 0.35em;
  }

  /* 4. Humanist - softer shapes, slightly warmer grey for a bright panel */
  .f-humanist {
    --ink: #23262b;
    --dim: #b3b8bf;
  }
  .f-humanist #clock {
    font-family: "Noto Sans", "Open Sans", "Segoe UI", Roboto, sans-serif;
    font-weight: 300;
    letter-spacing: -0.015em;
  }
  .f-humanist #sec {
    font-size: 0.36em;
    font-weight: 400;
    margin-left: 0.16em;
    vertical-align: 0.85em;
  }

  /* --------------------------------------------------------------------- */

  #date {
    position: absolute;
    bottom: 5vh;
    width: 100%;
    text-align: center;
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: calc(var(--scale) * 2.4vw);
    font-weight: 400;
    color: var(--dim);
  }
  .f-mono #date { font-family: Cousine, "Roboto Mono", monospace; }
  .f-heavy #date { font-weight: 700; }

  /* Transient readout while adjusting. Hidden at all other times. */
  #hud {
    position: absolute;
    top: 3vh;
    left: 0;
    width: 100%;
    text-align: center;
    font: 400 1.4vw/1 Roboto, Arial, sans-serif;
    color: var(--dim);
    opacity: 0;
    transition: opacity .18s;
    pointer-events: none;
  }
  #hud.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    #hud { transition: none; }
  }
</style>
</head>
<body class="f-grotesque">

<div id="shift">
  <div id="clock"><span id="hm">--:--</span><span id="sec">--</span></div>
</div>
<div id="date"></div>
<div id="hud"></div>

<script>
(function () {
  "use strict";

  // ---- config -------------------------------------------------------------
  var USE_24_HOUR = false;
  var SHOW_DATE   = true;
  var BURN_IN_SHIFT_MINUTES = 5;
  var BURN_IN_RANGE_PX = 14;
  var RELOAD_HOURS = 12;
  // -------------------------------------------------------------------------

  var FONTS = ["grotesque", "heavy", "mono", "humanist"];

  var hmEl   = document.getElementById("hm");
  var secEl  = document.getElementById("sec");
  var dateEl = document.getElementById("date");
  var shift  = document.getElementById("shift");
  var hud    = document.getElementById("hud");

  if (!SHOW_DATE) dateEl.style.display = "none";

  // ---- persisted appearance ----------------------------------------------
  function load(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v === null ? fallback : v;
    } catch (e) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }

  var scale = parseFloat(load("clock.scale", "1")) || 1;
  var font  = load("clock.font", "grotesque");
  if (FONTS.indexOf(font) === -1) font = "grotesque";

  function applyScale() {
    document.documentElement.style.setProperty("--scale", scale.toFixed(2));
  }
  function applyFont() {
    document.body.className = "f-" + font;
  }

  applyScale();
  applyFont();

  var hudTimer = null;
  function flash(text) {
    hud.textContent = text;
    hud.classList.add("on");
    clearTimeout(hudTimer);
    hudTimer = setTimeout(function () { hud.classList.remove("on"); }, 1400);
  }

  // ---- clock --------------------------------------------------------------
  var lastHM = "", lastSec = "", lastDate = "";

  function two(n) { return n < 10 ? "0" + n : "" + n; }

  function render() {
    var now = new Date();

    var h = now.getHours();
    if (!USE_24_HOUR) {
      h = h % 12;
      if (h === 0) h = 12;
    }

    var hm = (USE_24_HOUR ? two(h) : h) + ":" + two(now.getMinutes());
    if (hm !== lastHM) { hmEl.firstChild.data = hm; lastHM = hm; }

    var s = two(now.getSeconds());
    if (s !== lastSec) { secEl.firstChild.data = s; lastSec = s; }

    if (SHOW_DATE) {
      var d = now.toLocaleDateString(undefined, {
        weekday: "long", month: "long", day: "numeric"
      });
      if (d !== lastDate) {
        if (dateEl.firstChild) dateEl.firstChild.data = d;
        else dateEl.appendChild(document.createTextNode(d));
        lastDate = d;
      }
    }
    return now;
  }

  function tick() {
    var now = render();
    var delay = 1000 - (now.getTime() % 1000);
    if (delay < 30) delay += 1000;
    setTimeout(tick, delay);
  }

  // ---- keyboard controls --------------------------------------------------
  // + / -  resize     0  reset to 100%     F  cycle typeface
  document.addEventListener("keydown", function (e) {
    var k = e.key;

    if (k === "+" || k === "=" || k === "ArrowUp") {
      scale = Math.min(2.5, scale + 0.05);
      applyScale(); save("clock.scale", scale);
      flash("Size " + Math.round(scale * 100) + "%");
    } else if (k === "-" || k === "_" || k === "ArrowDown") {
      scale = Math.max(0.3, scale - 0.05);
      applyScale(); save("clock.scale", scale);
      flash("Size " + Math.round(scale * 100) + "%");
    } else if (k === "0") {
      scale = 1;
      applyScale(); save("clock.scale", scale);
      flash("Size 100%");
    } else if (k === "f" || k === "F") {
      font = FONTS[(FONTS.indexOf(font) + 1) % FONTS.length];
      applyFont(); save("clock.font", font);
      flash(font.charAt(0).toUpperCase() + font.slice(1));
    } else {
      return;
    }
    e.preventDefault();
  });

  // ---- housekeeping -------------------------------------------------------
  if (BURN_IN_SHIFT_MINUTES > 0) {
    setInterval(function () {
      var x = (Math.random() * 2 - 1) * BURN_IN_RANGE_PX;
      var y = (Math.random() * 2 - 1) * BURN_IN_RANGE_PX;
      shift.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0)";
    }, BURN_IN_SHIFT_MINUTES * 60 * 1000);
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) render();
  });

  if (RELOAD_HOURS > 0) {
    setTimeout(function () { location.reload(); }, RELOAD_HOURS * 3600 * 1000);
  }

  tick();

  // ---- keep the display awake --------------------------------------------
  var wakeLock = null;
  function requestWakeLock() {
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock;
      lock.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && wakeLock === null) requestWakeLock();
  });
  requestWakeLock();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>

</body>
</html>
